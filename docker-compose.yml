services:
  verifier:
    build: ./verifier
    restart: unless-stopped
    env_file: .env # CF_ACCOUNT_ID, CF_API_TOKEN (Cloudflare Workers AI), ALLOWED_ORIGIN, TRUST_PROXY
    ports:
      - "8787:8787"

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        VITE_VERIFIER_URL: http://localhost:8787
        VITE_BREEZ_API_KEY: ${VITE_BREEZ_API_KEY}
    ports:
      - "8080:80"
